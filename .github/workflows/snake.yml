name: Serpiente de contribuciones

# Genera la animación de la serpiente comiéndose el gráfico de contribuciones (estilo neón)
# y la publica en la rama "output", que es desde donde la lee el README.
on:
  schedule:
    - cron: "0 6 * * *" # todos los días a las 3:00 (hora Argentina)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-neon-dark.svg?palette=github-dark&color_snake=#00f0ff&color_dots=#161b22,#3a0ca3,#7209b7,#b5179e,#ff2bd6
            dist/snake-neon-light.svg?color_snake=#7209b7&color_dots=#ebedf0,#c7b8ff,#9d7bff,#b5179e,#ff2bd6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Actualizar serpiente de contribuciones
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
