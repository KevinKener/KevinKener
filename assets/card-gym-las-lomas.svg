<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" width="840" height="250" role="img" aria-label="GYM LAS LOMAS: Biblioteca de ejercicios en video que se abre con un QR">
<title>GYM LAS LOMAS · Biblioteca de ejercicios en video que se abre con un QR</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0c16"/><stop offset="1" stop-color="#07070d"/></linearGradient>
  <radialGradient id="glow" cx="100%" cy="0%" r="70%"><stop offset="0" stop-color="#00f0ff" stop-opacity=".18"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></radialGradient>
  <filter id="neon" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="2.5" result="a"/><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.5" result="a"/><feMerge><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .title { font: 800 30px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1.5px; fill: #f4feff; animation: pulse 3.2s ease-in-out infinite; }
  .subtitle { font: 600 16px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #00f0ff; }
  .line { font: 400 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #c9cdd8; }
  .tag { font: 700 11.5px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #00f0ff; }
  .chip { font: 500 13px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #e8eaf0; }
  .run { stroke-dasharray: 180 1984; animation: run 6s linear infinite; }
  .dot { animation: blink 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .82 } }
  @keyframes run { to { stroke-dashoffset: -2164 } }
  @keyframes blink { 50% { opacity: .25 } }
  @media (prefers-reduced-motion: reduce) { .title, .run, .dot { animation: none } }
</style>
<rect x="2" y="2" width="836" height="246" rx="18" fill="url(#bg)"/>
<rect x="2" y="2" width="836" height="246" rx="18" fill="url(#glow)"/>
<rect x="2" y="2" width="836" height="246" rx="18" fill="none" stroke="#00f0ff" stroke-opacity=".28" stroke-width="1.5"/>
<rect class="run" x="2" y="2" width="836" height="246" rx="18" fill="none" stroke="#00f0ff" stroke-width="2.5" filter="url(#soft)"/>
<g transform="translate(32,26)">
  <rect width="243.2" height="24" rx="6" fill="#00f0ff" fill-opacity=".1" stroke="#00f0ff" stroke-opacity=".6"/>
  <circle class="dot" cx="13" cy="12" r="4" fill="#00f0ff" filter="url(#soft)"/>
  <text x="24" y="16.5" class="tag" textLength="207.2" lengthAdjust="spacingAndGlyphs">EN PRODUCCIÓN · CLIENTE REAL</text>
</g>
<text x="32" y="88" class="title" filter="url(#neon)">GYM LAS LOMAS</text>
<text x="32" y="115" class="subtitle">Biblioteca de ejercicios en video que se abre con un QR</text>
<text x="32" y="148" class="line">Los socios escanean un QR en la pared y ven cómo se hace cada ejercicio. Sin login.</text>
<text x="32" y="171" class="line">190 videos · búsqueda tolerante a errores · 53 tests + CI · accesible y mobile first</text>
<g transform="translate(32.0,196)"><rect width="102.5" height="28" rx="14" fill="#00f0ff" fill-opacity=".08" stroke="#00f0ff" stroke-opacity=".55"/><text x="12" y="19" class="chip" textLength="78.5" lengthAdjust="spacingAndGlyphs">TypeScript</text></g><g transform="translate(142.5,196)"><rect width="55.4" height="28" rx="14" fill="#00f0ff" fill-opacity=".08" stroke="#00f0ff" stroke-opacity=".55"/><text x="12" y="19" class="chip" textLength="31.4" lengthAdjust="spacingAndGlyphs">Vite</text></g><g transform="translate(205.9,196)"><rect width="149.6" height="28" rx="14" fill="#00f0ff" fill-opacity=".08" stroke="#00f0ff" stroke-opacity=".55"/><text x="12" y="19" class="chip" textLength="125.6" lengthAdjust="spacingAndGlyphs">Cloudflare Pages</text></g><g transform="translate(363.5,196)"><rect width="78.9" height="28" rx="14" fill="#00f0ff" fill-opacity=".08" stroke="#00f0ff" stroke-opacity=".55"/><text x="12" y="19" class="chip" textLength="54.9" lengthAdjust="spacingAndGlyphs">Node.js</text></g><g transform="translate(450.4,196)"><rect width="71.1" height="28" rx="14" fill="#00f0ff" fill-opacity=".08" stroke="#00f0ff" stroke-opacity=".55"/><text x="12" y="19" class="chip" textLength="47.1" lengthAdjust="spacingAndGlyphs">ffmpeg</text></g><g transform="translate(529.5,196)"><rect width="110.3" height="28" rx="14" fill="#00f0ff" fill-opacity=".08" stroke="#00f0ff" stroke-opacity=".55"/><text x="12" y="19" class="chip" textLength="86.3" lengthAdjust="spacingAndGlyphs">Claude Code</text></g>
</svg>
