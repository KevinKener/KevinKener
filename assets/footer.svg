<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="¿Construimos algo juntos?">
<title>¿Construimos algo juntos?</title>
<defs><filter id="n" x="-10%" y="-80%" width="120%" height="260%"><feGaussianBlur stdDeviation="3" result="a"/><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset=".5" stop-color="#ff2bd6"/><stop offset="1" stop-color="#00f0ff"/></linearGradient></defs>
<style>
  .t { font: 800 38px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 3px; fill: #f4feff; animation: f 5s infinite; }
  .w { animation: s 4s linear infinite; }
  @keyframes f { 0%,40%,44%,100% { opacity: 1 } 42% { opacity: .5 } }
  @keyframes s { to { transform: translateX(-600px) } }
  @media (prefers-reduced-motion: reduce) { .t, .w { animation: none } }
</style>
<rect width="1200" height="120" rx="18" fill="#07070d"/>
<g class="w" opacity=".7"><path d="M0 100 Q 75 80 150 100 T 300 100 T 450 100 T 600 100 T 750 100 T 900 100 T 1050 100 T 1200 100 T 1350 100 T 1500 100 T 1650 100 T 1800 100" fill="none" stroke="url(#l)" stroke-width="2"/></g>
<text class="t" x="600" y="64" text-anchor="middle" filter="url(#n)">¿CONSTRUIMOS ALGO JUNTOS?</text>
</svg>
